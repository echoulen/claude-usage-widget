name: ClaudeUsage
options:
  bundleIdPrefix: io.echoulen
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  UsageCore:
    path: .

settings:
  base:
    CODE_SIGN_IDENTITY: "ClaudeUsage Local Signing"
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ClaudeUsage:
    type: application
    platform: macOS
    sources:
      - Sources/ClaudeUsageApp
      - Sources/ClaudeUsageApp/Assets.xcassets
    dependencies:
      - target: UsageWidget
        embed: true
      - package: UsageCore
        product: UsageCore
    info:
      path: Sources/ClaudeUsageApp/Info.plist
      properties:
        CFBundleDisplayName: Claude Usage
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.echoulen.ClaudeUsage
        CODE_SIGN_ENTITLEMENTS: Sources/ClaudeUsageApp/ClaudeUsage.entitlements
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  UsageWidget:
    type: app-extension
    platform: macOS
    sources:
      - Sources/UsageWidget
      - Sources/ClaudeUsageApp/Assets.xcassets
    dependencies:
      - package: UsageCore
        product: UsageCore
    info:
      path: Sources/UsageWidget/Info.plist
      properties:
        CFBundleDisplayName: Claude Usage
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.echoulen.ClaudeUsage.Widget
        CODE_SIGN_ENTITLEMENTS: Sources/UsageWidget/UsageWidget.entitlements
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

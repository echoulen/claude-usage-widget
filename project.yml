name: ClaudeUsage
options:
  bundleIdPrefix: io.echoulen
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  UsageCore:
    path: .

settings:
  base:
    CODE_SIGN_IDENTITY: "ClaudeUsage Local Signing"
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  ClaudeUsage:
    type: application
    platform: macOS
    sources:
      - Sources/ClaudeUsageApp
      - Sources/ClaudeUsageApp/Assets.xcassets
    dependencies:
      - target: UsageWidget
        embed: true
      - package: UsageCore
        product: UsageCore
    info:
      path: Sources/ClaudeUsageApp/Info.plist
      properties:
        CFBundleDisplayName: Claude Usage
        LSUIElement: true
        # 用 info: 產生 plist 時，settings 裡的 MARKETING_VERSION 不會自動流進來，
        # 版本會凍在預設的 1.0/1。macOS 依 bundle 版本判斷小工具 metadata
        # （icon、說明文字）快取要不要失效，凍住就永遠顯示第一次快取的內容。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.echoulen.ClaudeUsage
        CODE_SIGN_ENTITLEMENTS: Sources/ClaudeUsageApp/ClaudeUsage.entitlements
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  UsageWidget:
    type: app-extension
    platform: macOS
    sources:
      - Sources/UsageWidget
      - Sources/ClaudeUsageApp/Assets.xcassets
    dependencies:
      - package: UsageCore
        product: UsageCore
    info:
      path: Sources/UsageWidget/Info.plist
      properties:
        CFBundleDisplayName: Claude Usage
        # 同上：extension 的版本也必須跟著動，否則圖庫的 metadata 不會刷新。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.echoulen.ClaudeUsage.Widget
        CODE_SIGN_ENTITLEMENTS: Sources/UsageWidget/UsageWidget.entitlements
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
